#===================================================
# Explicacion introductoria
#===================================================
- Class: text
  Output: En esta lección trabajaremos con datos de tiempos de respuesta de un sistema (en milisegundos), simulando el monitoreo del rendimiento de un servidor. Usaremos esta población para entender qué es una distribución muestral. 

- Class: text 
  Output: Es importante distinguir tres cosas que suenan parecido pero son distintas. (NIST/SEMATECH, 2002). La distribución de los datos es cómo se comportan TODOS los valores de la población completa (los 1000 tiempos de respuesta). La distribución de una muestra es cómo se ven los valores dentro de UNA sola muestra que tomamos (por ejemplo, 30 tiempos de respuesta). La distribución muestral de un estadístico es diferente a ambas, se obtiene calculado un estadístico (como la media) en MUCHAS muestras distintas, y viendo cómo se distribuyen esos resultados entre sí. 
  
# NIST/SEMATECH e-Handbook of Statistical Methods. National Institute of Standards and Technology.
# https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook

- Class: text
  Output: Por ejemplo, si tomamos 50 muestras distintas de 30 tiempos de respuesta cada una, y calculamos la media de cada una de esas 50 muestras, obtendremos 50 medias distintas. La forma en que se distribuyen esas 50 medias es la distribución muestral de la media. 
  
#===================================================
# Distribución muestral de la media
#===================================================

- Class: text
  Output: La media muestral es el promedio de los valores dentro de una muestra (Newbold et al., 2008). Cuando tomamos muchas muestras distintas de la misma población y calculamos la media de cada una, esas medias no son siempre iguales entre sí, mostrando variabilidad. A esa variabilidad la estudia la distribución muestral de la media. 
  
# Newbold, P., Carlson, W. L., & Thorne, B. M. (2008). Estadística para administración y economía (6.ª ed.). Pearson Educación.
  
- Class: cmd_question
  Output: Empecemos con una sola muestra. Utiliza la función sample() para tomar 30 tiempos de respuesta de la columna tiempo_ms de la poblacion tiempos_respuesta y guárdalos en una variable llamada muestra_30.
  CorrectAnswer: muestra_30 <- sample(tiempos_respuesta$tiempo_ms, 30)
  AnswerTests: omnitest(correctExpr='muestra_30 <- sample(tiempos_respuesta$tiempo_ms, 30)')
  Hint: Usa sample() con tiempos_respuesta$tiempo_ms como primer argumento y 30 como tamaño de muestra.
  
- Class: cmd_question
  Output: Escribe muestra_30 para ver los 30 valores que obtuviste.
  CorrectAnswer: muestra_30
  AnswerTests: omnitest(correctExpr='muestra_30')
  Hint: Solo escribe el nombre de la variable, sin nada más.
  
- Class: cmd_question
  Output: Ahora calcula la media de esa muestra usando la función mean() y guárdala en una variable llamada media_muestra_30.
  CorrectAnswer: media_muestra_30 <- mean(muestra_30)
  AnswerTests: omnitest(correctExpr='media_muestra_30 <- mean(muestra_30)')
  Hint: Usa mean() sobre la variable muestra_30 que acabas de crear.

- Class: cmd_question
  Output: Escribe media_muestra_30 para ver el valor obtenido.
  CorrectAnswer: media_muestra_30
  AnswerTests: omnitest(correctExpr='media_muestra_30')
  Hint: Solo escribe el nombre de la variable.
  
- Class: text
  Output: Ahora repitamos el proceso muchas veces. La función replicate() nos permite ejecutar la misma operación un número determinado de veces y guardar todos los resultados en un solo vector. Esto es justo lo que necesitamos para construir una distribución muestral. 
  
- Class: cmd_question
  Output: Utiliza replicate() para repetir 200 veces el proceso de tomar una muestra de 30 tiempos de respuesta y calcular su media. Guarda el resultado en una variable llamada medias_muestrales. 
  CorrectAnswer: medias_muestrales <- replicate(200, mean(sample(tiempos_respuesta$tiempo_ms, 30)))
  AnswerTests: omnitest(correctExpr='medias_muestrales <- replicate(200, mean(sample(tiempos_respuesta$tiempo_ms, 30)))')
  Hint: replicate() recibe primero el número de repeticiones, y después la expresión que quieres repetir. 
  
- Class: cmd_question
  Output: Usa head() para ver los primeros valores de medias_muestrales (son 200 en total, no queremos verlas todas).
  CorrectAnswer: head(medias_muestrales)
  AnswerTests: omnitest(correctExpr='head(medias_muestrales)')
  Hint: head() muestra por defecto los primeros 6 valores de un vector.
  
- Class: cmd_question
  Output: Ahora observa la variabilidad de esas 200 medias calculando su desviación estándar con sd().
  CorrectAnswer: sd(medias_muestrales)
  AnswerTests: omnitest(correctExpr='sd(medias_muestrales)')
  Hint: Usa la función sd() sobre el vector medias_muestrales.
  
- Class: mult_question
  Output: Acabas de calcular 200 medias muestrales distintas, cada una basada en una muestra diferente de 30 tiempos de respuesta. ¿Qué representa la variabilidad (desviación estándar) que acabas de calcular?
  AnswerChoices: La variabilidad de un solo tiempo de respuesta individual.;La variabilidad entre las medias de las distintas muestras tomadas.;El tiempo de respuesta más alto registrado en la población.;El número total de servidores en la población.
  CorrectAnswer: La variabilidad entre las medias de las distintas muestras tomadas. 
  AnswerTests: omnitest(correctVal='La variabilidad entre las medias de las distintas muestras tomadas.')
  Hint: Piensa en qué guardaste dentro del vector medias_muestrales.
  
- Class: text
  Output: Un patrón importante en las distribuciones muestrales de la media es que, entre más grande sea el tamaño de cada muestra, menor es la variabilidad entre las medias muestrales (Newbold et al., 2008).. Es decir, muestras más grandes producen medias más consistentes entre sí, más cercanas a la media real de la población.
  
# Newbold, P., Carlson, W. L., & Thorne, B. M. (2008). Estadística para administración y economía (6.ª ed.). Pearson Educación.
  
- Class: cmd_question 
  Output: Comprobemos este patrón. Repite el mismo proceso de replicate(), pero ahora usando muestras de tamaño 100 en vez de 30, y guarda el resultado en una variable llamada medias_muestrales_100.
  CorrectAnswer: medias_muestrales_100 <- replicate(200, mean(sample(tiempos_respuesta$tiempo_ms, 100)))
  AnswerTests: omnitest(correctExpr='medias_muestrales_100 <- replicate(200, mean(sample(tiempos_respuesta$tiempo_ms, 100)))')
  Hint: Es la misma expresión que usaste antes, solo cambia el tamaño de muestra de 30 a 100.
  
- Class: mult_question
  Output: Si comparas sd(medias_muestrales) contra sd(medias_muestrales_100), ¿qué esperarías observar?
  AnswerChoices: Que sd(medias_muestrales_100) sea menor, porque las muestras más grandes generan medias más consistentes.;Que ambas desviaciones sean siempre idénticas.;Que sd(medias_muestrales_100) sea mayor, porque hay más datos por muestra.;Que la desviación estándar no tenga relación con el tamaño de muestra.
  CorrectAnswer: Que sd(medias_muestrales_100) sea menor, porque las muestras más grandes generan medias más consistentes. 
  AnswerTests: omnitest(correctVal='Que sd(medias_muestrales_100) sea menor, porque las muestras más grandes generan medias más consistentes.')
  Hint: Recuerda el patrón que acabamos de mencionar sobre tamaño de muestra y variabilidad. 
  
- Class: cmd_question
  Output: Comprobemos tu respuesta. Calcula sd(medias_muestrales_100) para ver si tu predicción fue correcta.
  CorrectAnswer: sd(medias_muestrales_100)
  AnswerTests: omnitest(correctExpr='sd(medias_muestrales_100)')
  Hint: Usa la función sd() sobre el vector medias_muestrales_100.

- Class: text
  Output: Como puedes ver, la desviación estándar de las medias con muestras de 100 es menor que la de
    las medias con muestras de 30. Esto confirma el patrón que discutimos.
    
- Class: text
  Output: Con esto cerramos el subtema de la media muestral. Vimos cómo obtener una muestra, calcular su media, repetir el proceso muchas veces para construir una distribución muestral,y cómo el tamaño de muestra afecta la variabilidad de esa distribución. 
  
#===================================================
# Distribución muestral de la proporcion
#===================================================

- Class: text
  Output: Cuando la variable que nos interesa es categórica (por ejemplo, qué servidor atendió una petición) en lugar de numérica, no calculamos una media, sino una proporción (Newbold et al., 2008). La proporción muestral es el porcentaje de elementos de una muestra que cumplen cierta condición. Igual que con la media, si tomamos muchas muestras distintas y calculamos la proporción en cada una, esas proporciones formarán su propia distribución muestral. 
  
# Newbold, P., Carlson, W. L., & Thorne, B. M. (2008). Estadística para administración y economía (6.ª ed.). Pearson Educación.

- Class: cmd_question
  Output: Toma una muestra de 50 registros de la columna servidor de la poblacion tiempos_respuesta, usando sample(), y guárdala en una variable llamada muestra_servidor. 
  CorrectAnswer: muestra_servidor <- sample(tiempos_respuesta$servidor, 50)
  AnswerTests: omnitest(correctExpr='muestra_servidor <- sample(tiempos_respuesta$servidor, 50)')
  Hint: Usa sample() con tiempos_respuesta$servidor como primer argumento y 50 como tamaño de muestra.

- Class: cmd_question
  Output: Escribe muestra_servidor para ver los 50 valores que obtuviste.
  CorrectAnswer: muestra_servidor
  AnswerTests: omnitest(correctExpr='muestra_servidor')
  Hint: Solo escribe el nombre de la variable.
  
- Class: cmd_question
  Output: Calcula qué proporción de esa muestra corresponde al servidor "A". Puedes hacerlo con mean(muestra_servidor == "A"), que cuenta cuántos valores cumplen la condición y los divide entre el total. Guarda el resultado en una variable llamada proporcion_A.
  CorrectAnswer: proporcion_A <- mean(muestra_servidor == "A")
  AnswerTests: omnitest(correctExpr='proporcion_A <- mean(muestra_servidor == "A")')
  Hint: mean() sobre una comparación lógica (==) calcula directamente la proporción de valores TRUE.
  
- Class: cmd_question
  Output: Escribe proporcion_A para ver el valor obtenido.
  CorrectAnswer: proporcion_A
  AnswerTests: omnitest(correctExpr='proporcion_A')
  Hint: Solo escribe el nombre de la variable.
  
- Class: text
  Output: Ahora repitamos este proceso muchas veces, igual que hicimos con la media, para observar cómo varia la proporción de un servidor entre distintas muestras. 
  
- Class: cmd_question
  Output: Utiliza replicate() para repetir 200 veces el proceso de tomar una muestra de 50 registros de servidor y calcular la proporción del servidor "A". Guarda el resultado en una variable llamada proporciones_muestrales.
  CorrectAnswer: proporciones_muestrales <- replicate(200, mean(sample(tiempos_respuesta$servidor, 50) == "A"))
  AnswerTests: omnitest(correctExpr='proporciones_muestrales <- replicate(200, mean(sample(tiempos_respuesta$servidor, 50) == "A"))')
  Hint: Es la misma lógica de replicate() que usaste con la media, pero ahora repitiendo el cálculo de proporción. 
  
- Class: cmd_question
  Output: Usa head() para ver los primeros valores de proporciones_muestrales.
  CorrectAnswer: head(proporciones_muestrales)
  AnswerTests: omnitest(correctExpr='head(proporciones_muestrales)')
  Hint: head() muestra por defecto los primeros 6 valores de un vector.
  
- Class: mult_question
  Output: Observas que las 200 proporciones que calculaste no son todas idénticas, sino que varían alrededor de un valor central. ¿Qué representa esa variación?
  AnswerChoices: Un error en el código, ya que todas las proporciones deberían ser iguales.;La variabilidad natural que existe entre distintas muestras tomadas de la misma población.;Que el servidor A cambia de comportamiento entre muestras.;Que la población original tiene datos incorrectos. 
  CorrectAnswer: La variabilidad natural que existe entre distintas muestras tomadas de la misma población. 
  AnswerTests: omnitest(correctVal='La variabilidad natural que existe entre distintas muestras tomadas de la misma población.')
  Hint: Piensa en que cada muestra fue tomada al azar, y el azar produce diferencias. 
  
- Class: text
  Output: Con esto cerramos el subtema de la proporción muestral. Vimos cómo obtener una muestra de una variable categórica, calcular la proporción de una categoría de interés, repetir el proceso muchas veces, e interpretar la variabilidad resultante entre esas proporciones. 
  
#===================================================
# Distribución muestral de la varianza
#===================================================

- Class: text
  Output: La varianza es una medida de dispersión que indica qué tan alejados están los valores respecto a la media (Newbold et al., 2008). Al igual que con la media y la proporción, si tomamos muchas muestras distintas de la misma población y calculamos la varianza de cada una, esas varianzas también forman su propia distribución muestral. 
  
# Newbold, P., Carlson, W. L., & Thorne, B. M. (2008). Estadística para administración y economía (6.ª ed.). Pearson Educación.

- Class: cmd_question
  Output: Toma una muestra de 40 tiempos de respuesta de tiempos_respuesta$tiempo_ms usando sample(), y guárdala en una variable llamada muestra_var.
  CorrectAnswer: muestra_var <- sample(tiempos_respuesta$tiempo_ms, 40)
  AnswerTests: omnitest(correctExpr='muestra_var <- sample(tiempos_respuesta$tiempo_ms, 40)')
  Hint: Usa sample() con tiempos_respuesta$tiempo_ms como primer argumento y 40 como tamaño de muestra. 
  
- Class: cmd_question
  Output: Calcula la varianza de esa muestra usando la función var(), y guárdala en una variable llamada varianza_muestra.
  CorrectAnswer: varianza_muestra <- var(muestra_var)
  AnswerTests: omnitest(correctExpr='varianza_muestra <- var(muestra_var)')
  Hint: Usar var() sobre la variable muestra_var que acabas de crear.
  
- Class: cmd_question
  Output: Escribe varianza_muestra para ver el valor obtenido. 
  CorrectAnswer: varianza_muestra
  AnswerTests: omnitest(correctExpr='varianza_muestra')
  Hint: Solo escribe el nombre de la variable.
  
- Class: text
  Output: Ahora repitamos el proceso muchas veces para observar cómo varían las varianzas entre distintas muestras. 
  
- Class: cmd_question 
  Output: Utiliza replicate() para repetir 200 veces el proceso de tomar una muestra de 40 tiempos de respuesta y calcular su varianza. Guarda el resultado en una variable llamada varianzas_muestrales. 
  CorrectAnswer: varianzas_muestrales <- replicate(200, var(sample(tiempos_respuesta$tiempo_ms, 40)))
  AnswerTests: omnitest(correctExpr='varianzas_muestrales <- replicate(200, var(sample(tiempos_respuesta$tiempo_ms, 40)))')
  Hint: Es la misma estructura de replicate() que ya usaste, pero calculando var() en vez de mean().
  
- Class: cmd_question
  Output: Usa head() para ver los primeros valores de varianzas_muestrales. 
  CorrectAnswer: head(varianzas_muestrales)
  AnswerTests: omnitest(correctExpr='head(varianzas_muestrales)')
  Hint: head() muestra por defecto los primeros 6 valores de un vector. 
  
- Class: mult_question
  Output: Comparando las 200 varianzas que obtuviste, notas que no son idénticas entre sí. ¿A qué se debe esto?
  AnswerChoices: A que cada muestra de 40 tiempos de respuesta es distinta, por lo que su dispersión interna también varía.;A que la función var() calcula mal el resultado.;A que la población cambia entre cada llamada a sample().;A que R redondea los resultados de forma aleatoria. 
  CorrectAnswer: A que cada muestra de 40 tiempos de respuesta es distinta, por lo que su dispersión interna también varía. 
  AnswerTests: omnitest(correctVal='A que cada muestra de 40 tiempos de respuesta es distinta, por lo que su dispersión interna también varía.')
  Hint: Piensa en que cada sample() toma valores distintos al azar. 
  
- Class: text
  Output: Con esto cerramos el subtema de la varianza muestral, y con él, los tres estadísticos principales que puede tomar una distribución muestral, media, proporción y varianza. 
  
#===================================================
# Actividad de aplicacion
#===================================================

- Class: text
  Output: Pongamos en práctica lo aprendido con un caso más realista. Imagina que eres analista de rendimiento y tienes que decidir tú mismo qué estadístico calcular.
  
- Class: mult_question
  Output: Situación 1 - Tu jefe pregunta "¿Qué tan consistente es el servidor C, o varía mucho su tiempo de respuesta entre peticiones?" ¿Qué estadístico calcularías para responder esto?
  AnswerChoices: Media;Proporción;Varianza
  CorrectAnswer: Varianza
  AnswerTests: omnitest(correctVal='Varianza')
  Hint: Piensa en qué estadístico mide qué tan dispersos están los datos, no su valor típico.
  
- Class: cmd_question
  Output: Toma una muestra de 40 registros de tiempo_ms donde el servidor sea "C" (usa subset() para filtrar primero subset(tiempos_respuesta, servidor == "C")$tiempo_ms, y luego sample() sobre eso), calcula la varianza con var(), y guardala en una variable llamada varianza_servidor_C.
  CorrectAnswer: varianza_servidor_C <- var(sample(subset(tiempos_respuesta, servidor == "C")$tiempo_ms, 40))
  AnswerTests: omnitest(correctExpr='varianza_servidor_C <- var(sample(subset(tiempos_respuesta, servidor == "C")$tiempo_ms, 40))')
  Hint: Primero filtra con subset(), luego aplica sample() al resultado, y finalmente var() a la muestra.
  
- Class: cmd_question
  Output: Escribe varianza_servidor_C para ver el valor obtenido.
  CorrectAnswer: varianza_servidor_C
  AnswerTests: omnitest(correctExpr='varianza_servidor_C')
  Hint: Solo escribe el nombre de la variable. 
- Class: text
  Output: Con este valor de varianza ya puedes responder a tu jefe qué tan consistente (o inconsistente) es el servidor C, entre más alta la varianza, más variable es su tiempo de respuesta entre peticiones. 
  
- Class: mult_question
  Output: Situación 2 - Ahora te preguntan "¿Cuál es el tiempo de respuesta típico del sistema completo?" 
  AnswerChoices: Media;Proporción;Varianza
  CorrectAnswer: Media
  AnswerTests: omnitest(correctVal='Media')
  Hint: Típico suele referirse al valor central de los datos. 
  
- Class: cmd_question
  Output: Toma una muestra de 40 registros de tiempo_ms de toda la poblacion tiempos_respuesta (sin filtrar por servidor esta vez), calcula su media con mean(), y guárdala en una variable llamada media_sistema. 
  CorrectAnswer: media_sistema <- mean(sample(tiempos_respuesta$tiempo_ms, 40))
  AnswerTests: omnitest(correctExpr='media_sistema <- mean(sample(tiempos_respuesta$tiempo_ms, 40))')
  Hint: Usa sample() sobre tiempos_respuesta$tiempo_ms y aplica mean() al resultado. 
  
- Class: cmd_question
  Output: Escribe media_sistema para ver el valor obtenido.
  CorrectAnswer: media_sistema
  AnswerTests: omnitest(correctExpr='media_sistema')
  Hint: Solo escribe el nombre de la variable
  
- Class: text
  Output: Este valor es tu respuesta al tiempo de respuesta típico del sistema completo, sin importar qué servidor atendió cada petición. 
  
- Class: mult_question
  Output: Situación 3 - Finalmente te preguntan "¿Qué porcentaje de las peticiones fueron atendidas por el servidor B?"
  AnswerChoices: Media;Proporción;Varianza
  CorrectAnswer: Proporción
  AnswerTests: omnitest(correctVal='Proporción')
  Hint: Fíjate en qué tipo de variable es servidor y qué te están pidiendo medir sobre ella. 
  
- Class: cmd_question
  Output: Toma una muestra de 60 registros de la columna servidor, y calcula la proporción que corresponde al servidor "B" usando mean(). Guarda el resultado en una variable llamada proporcion_B.
  CorrectAnswer: proporcion_B <- mean(sample(tiempos_respuesta$servidor, 60) == "B")
  AnswerTests: omnitest(correctExpr='proporcion_B <- mean(sample(tiempos_respuesta$servidor, 60) == "B")')
  Hint: Usa sample() sobre tiempos_respuesta$servidor y compáralo con == "B" dentro de mean().
  
- Class: cmd_question
  Output: Escribe proporcion_B para ver el valor obtenido.
  CorrectAnswer: proporcion_B
  AnswerTests: omnitest(correctExpr='proporcion_B')
  Hint: Solo escribe el nombre de la variable.
  
- Class: text
  Output: Ese valor, multiplicado por 100, te da el porcentaje aproximado de peticiones atendidas por el servidor B, la respuesta directa a la pregunta original.
  
- Class: text
  Output: Como viste, cada pregunta de negocio o de análisis apunta a un estadístico distinto. Reconocer cuál usar es tan importante como saber calcularlo correctamente. 
  
#===================================================
# Cierre de la lección
#===================================================

- Class: text
  Output: En esta lección aprendiste qué es una distribución muestral y cómo se diferencia de la distribución de los datos y de la distribución de una sola muestra. Practicaste con los tres estadísticos principales (media, proporción y varianza), viendo en cada caso cómo obtener una muestra, calcular el estadístico, repetir el proceso muchas veces con replicate(), y observar la variabilidad resultante. También viste cómo el tamaño de muestra afecta esa variabilidad. En la siguiente lección aplicarás todo esto en un caso completo de principio a fin. 
  

