# Explicacion
#===================================================
- Class: text
  Output: Se denomina muestreo al proceso por el que generamos las muestras. Una muestra es
    una parte de la población, y se desea que la muestra sea lo más representativa posible de la 
    población de la que procede. Esto significa que su tendencia central, variabilidad, etc., 
    aproximarán las de la población, pero habrá cierta diferencia, que interesa sea lo menor posible.
    
- Class: text
  Output: En el muestreo existe un concepto clave que ayuda a entender el motivo de las muestras "la poblacion".
    Una población es un conjunto completo de individuos u objetos que comparten características similares. La 
    población puede comprender una nación o un grupo de personas u objetos con una característica común. 
    Incluye a todo el grupo bien definido sobre el que cualquier investigación quiere extraer conclusiones.

# A tomar en cuenta -------!    
