- Class: text
  Output: Un ejemplo que explica mejor el muestro. Sea un curso con 40 estudiantes, queremos conocer la Media 
    de las puntuaciones del curso, pero por diversas razones no tenemos acceso a todos los datos, supongamos que 
    podemos seleccionar cinco puntuaciones aleatoriamente y obtener la Media de la muestra. Si repetimos el proceso 
    y generamos más muestras tendremos más Medias muestrales y podremos ver cómo se distribuyen.
    
- Class: exact_question
  Output: Una universidad tiene 20,000 alumnos inscritos y se seleccionan a 500 alumnos para responder una encuesta,  ¿Cual es la poblacion?
  CorrectAnswer: 20000
  AnswerTest: omnitest(correctVal = 20000)
  Hint: Recuerda el concepto clave de la poblacion.
  
- Class: exact_question
