- Class: text
  Output: El objetivo de esta lección es comprender los conceptos fundamentales del muestreo, identificando qué es una población, 
    una muestra, la representatividad y el error de muestreo. Además, se busca que el alumno conozca el uso básico de las funciones 
    set.seed() y sample() en R para generar muestras aleatorias y reconocer la relación entre una población y su muestra.

#===================================================
# Explicacion
#===================================================
- Class: text
  Output: El muestreo es el proceso mediante el cual seleccionamos una muestra a partir de una población más grande (Universidad de Valencia, s.f.). Se busca que esa muestra refleje lo mejor posible las características de la población de origen, su tendencia central, su variabilidad, etc., aunque siempre existirá cierta diferencia entre ambas que conviene mantener lo más pequeña posible.
    
- Class: text
  Output: En el muestreo existe un concepto clave que ayuda a entender el motivo de las muestras "la poblacion".
    Una población es un conjunto completo de individuos u objetos que comparten características similares (Universidad de Valencia, s.f.). La 
    población puede comprender una nación o un grupo de personas u objetos con una característica común. 
    Incluye a todo el grupo bien definido sobre el que cualquier investigación quiere extraer conclusiones. 
  
# Universidad de Valencia. (s.f.). Introducción a la inferencia estadística. Universitat de València.
# https://www.uv.es/webgid/Inferencial/21_introduccin.html

- Class: text
  Output: Además, el propósito central del muestreo es entender cómo se relaciona la distribución de una variable dentro de la población completa con la distribución de esa misma variable dentro de la muestra que se seleccionó (Otzen & Manterola, 2017).

- Class: text
  Output: Para que una muestra sea representativa, debe cumplir dos condiciones, que la selección haya sido al azar, dando a cada individuo de la población la misma posibilidad de ser elegido, y que el número de personas seleccionadas sea suficiente para reflejar numéricamente a la población de origen (Otzen & Manterola, 2017). Cuando una muestra cumple esto, es posible generalizar sus resultados de vuelta hacia la población completa con un margen de error calculable.

# Otzen, T., & Manterola, C. (2017). Técnicas de muestreo sobre una población a estudio.
# International Journal of Morphology, 35(1), 227-232. https://scielo.conicyt.cl/pdf/ijmorphol/v35n1/art37.pdf  
    
- Class: mult_question
  Output: Una empresa tiene 1,000 empleados, de los cuales 500 trabajan en el turno matutino y 500 en el turno nocturno. Para conocer la satisfacción de todos los empleados se seleccionan únicamente 100 trabajadores del turno matutino. ¿Cuál es el principal problema con esta muestra?
  AnswerChoices: La muestra es demasiado grande para realizar un estudio.;La muestra incluye a todos los empleados de la empresa.;La muestra puede no ser representativa porque no incluye trabajadores del turno nocturno.;No existe ningún problema porque se seleccionaron 100 empleados.
  CorrectAnswer: La muestra puede no ser representativa porque no incluye trabajadores del turno nocturno.
  AnswerTests: omnitest(correctVal = "La muestra puede no ser representativa porque no incluye trabajadores del turno nocturno.")
  Hint: Piensa si todos los grupos importantes de la población están representados en la muestra.
    
- Class: text
  Output: Otro concepto importante del muestreo es el error muestral, que se refiere a la variación natural que existe entre distintas muestras tomadas de una misma población (Newbold et al., 2008). Aunque se tenga mucho cuidado al seleccionar dos muestras del mismo tamaño de una población, es normal que no resulten idénticas entre sí. Entender este concepto es clave para comprender la estadística inferencial más adelante. 

# Newbold, P., Carlson, W. L., & Thorne, B. M. (2008). Estadística para administración y economía
# (6.ª ed.). Pearson Educación.

- Class: text
  Output: Un ejemplo que explica mejor el muestreo. Sea un curso con 40 estudiantes, queremos conocer la Media 
    de las puntuaciones del curso, pero por diversas razones no tenemos acceso a todos los datos, supongamos que 
    podemos seleccionar cinco puntuaciones aleatoriamente y obtener la Media de la muestra. Si repetimos el proceso 
    y generamos más muestras tendremos más Medias muestrales y podremos ver cómo se distribuyen.
    
- Class: exact_question
  Output: Una universidad tiene 20,000 alumnos inscritos y se seleccionan a 500 alumnos para responder una encuesta,  ¿Cual es la poblacion?
  CorrectAnswer: 20000
  AnswerTests: omnitest(correctVal = 20000)
  Hint: Recuerda el concepto clave de la poblacion.
  
- Class: exact_question
  Output: De la pregunta anterior ¿Cual es la muestra?
  CorrectAnswer: 500
  AnswerTests: omnitest(correctVal = 500)
  Hint: Una parte de la poblacion.
  
- Class: text
  Output: Para empezar con el muestreo utilizaremos el metodo set.seed(123) que lo que significa es que nos da datos de una lista que en 
    este caso serian las poblaciones aleatoriamente. Vamos a ponerlo en practica.
    
- Class: cmd_question
  Output: Ingresa primero el metodo set.seed(123).
  CorrectAnswer: set.seed(123)
  AnswerTests: omnitest(correctExpr='set.seed(123)')
  Hint: Utiliza la funcion set.seed(123). Revisa que todo este bien escrito.

- Class: cmd_question
  Output: Creara una lista del 1 al 50 y almacenala en una variable llamada poblacion
  CorrectAnswer: poblacion <- 1:50
  AnswerTests: omnitest(correctExpr='poblacion <- 1:50')
  Hint: Usa la siguiente expresion 1:50
  
- Class: cmd_question
  Output: Ahora para ver esta aleatoridad vamos a obtener la muestra de esa poblacion, utiliza la funcion sample() para 
    obtener una muestra de 5 datos de la poblacion creada, usando como primer parametro la poblacion y como segundo parametro la muestra.
  CorrectAnswer: sample(poblacion, 5)
  AnswerTests: omnitest(correctExpr='sample(poblacion, 5)')
  Hint: Para usar bien el sample utiliza la poblacion como argumento inicial y el segundo argumento usa el tamaño de la muestra.
  
- Class: text
  Output: Actividad práctica.
    Imagina que eres un investigador que desea estudiar una población de 100 personas.
    Debido a que analizar a todas las personas puede resultar complicado, utilizarás R
    para seleccionar una muestra aleatoria de 10 personas.
    
    Durante esta actividad deberás crear la población y posteriormente obtener una muestra
    utilizando las funciones que acabas de aprender.

- Class: cmd_question
  Output: Crea una población de 100 personas utilizando los números del 1 al 100 y almacénala en una variable llamada poblacion_actividad.
  CorrectAnswer: poblacion_actividad <- 1:100
  AnswerTests: omnitest(correctExpr='poblacion_actividad <- 1:100')
  Hint: Utiliza los dos puntos para crear una secuencia del 1 al 100.

- Class: cmd_question
  Output: Establece una semilla utilizando set.seed(456) para que los resultados puedan reproducirse.
  CorrectAnswer: set.seed(456)
  AnswerTests: omnitest(correctExpr='set.seed(456)')
  Hint: Utiliza la función set.seed().

- Class: cmd_question
  Output: Obtén una muestra aleatoria de 10 elementos de poblacion_actividad utilizando sample().
  CorrectAnswer: sample(poblacion_actividad, 10)
  AnswerTests: omnitest(correctExpr='sample(poblacion_actividad, 10)')
  Hint: El primer argumento es la población y el segundo es el tamaño de la muestra.

- Class: mult_question
  Output: En la actividad anterior, ¿qué representan los 10 datos obtenidos mediante sample()?
  AnswerChoices: La población completa;Una muestra de la población;Un error de muestreo;Una nueva población
  CorrectAnswer: Una muestra de la población
  AnswerTests: omnitest(correctVal = "Una muestra de la población")
  Hint: Recuerda que una muestra es una parte de la población.
  
- Class: text
  Output: Como se puede ver, se muestran datos aleatorios de la poblacion lo que ayuda a la obtencion de datos para un analisis. Este proceso 
    de meter la poblacion y generar la muestra no lo tendras que hacer, en las siguientes lecciones se hara uso del archivo initLesson que 
    creara todo por ti para conocer los distintos metodos de muestreo. Esta leccion tuvo como objetivo que el alumno reconociera el concepto 
    basico del muestreo y entendiera el manejo de los comandos de R para la obtencion de este misma.
