- Class: text
  Output: Con esto completas la actividad integradora y el curso completo de Muestreo. En este problema recorriste el proceso completo que sigue cualquier analista de datos en la vida real. 
  
- Class: text
  Output: A lo largo de las 4 lecciones de este curso aprendiste los fundamentos del muestreo, los 5 métodos principales (muestreo aleatorio simple, sistemático, estratificado, conglomerados y conveniencia), y las 3 distribuciones muestrales más importantes (media, proporción y varianza). Estas herramientas son la base de cualquier análisis de datos, encuesta o proceso de toma de decisiones basado en información real. 
  
  